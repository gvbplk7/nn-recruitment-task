spring:
  application:
    name: account
  datasource:
    url: jdbc:h2:file:${H2_DB_FILE:./data/account-db};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

nbp:
  api:
    base-url: https://api.nbp.pl

resilience4j:
  circuitbreaker:
    instances:
      nbpApi:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-type: COUNT_BASED
